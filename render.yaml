# Render Blueprint — deploys StoryMapper as one web service (API + built
# frontend) plus a managed Postgres database.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: storymapper-db
    plan: free
    databaseName: storymapper
    user: storymapper

services:
  - type: web
    name: storymapper
    runtime: node
    plan: free
    buildCommand: ./render-build.sh
    startCommand: cd prd_be && node server.js
    healthCheckPath: /api/providers
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: storymapper-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Set these in the Render dashboard (or leave blank and let users
      # paste keys in the app's Settings UI):
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
